<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>粤见 · 序幕试做｜亲自上手试试</title>
<style>
:root{
  --paper:#F4EFE3; --paper2:#EAE1CE; --paper3:#E2D6BA;
  --ink:#1E1B18; --ink2:rgba(30,27,24,.84); --mute:rgba(30,27,24,.62);
  --person:#3A5748; --acc:#A6402C;
  --acc-ink:#7A3323;   /* v5 真源：元信息/引语压暗朱 */
  --kai:"Kaiti SC","STKaiti","KaiTi",serif;
  --orn:rgba(30,27,24,.38); --orn2:rgba(30,27,24,.18); --line:rgba(30,27,24,.16);
  --song:"Songti SC","STSong","Noto Serif SC",serif;
  --mincho:"FZFW ZhuZi MinchoS","FZFW ZhuZi MinchoS LB","方正FW筑紫明朝 简",
    "Songti SC","STSong","Noto Serif SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB",sans-serif;
  --e:cubic-bezier(.16,.84,.24,1);
  --e-guide:cubic-bezier(.3,.6,.35,1);
  --e-yin:cubic-bezier(.2,.9,.2,1.2);
  --e-exit:cubic-bezier(.5,0,.75,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--paper);overflow:hidden;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;font-family:var(--sans);color:var(--ink)}
.stage{position:relative;width:100%;max-width:430px;height:100vh;height:100dvh;margin:0 auto;
  overflow:hidden;background:var(--paper)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--paper)}
.screen.on{display:flex}

/* ── 幕0 · 承诺 ── */
#s0{align-items:center;justify-content:center;text-align:center}
#s0 .in{display:flex;flex-direction:column;align-items:center}
#s0 .kick{font-size:10px;letter-spacing:.34em;color:var(--mute);
  opacity:0;animation:kick .5s var(--e) .26s forwards}
#s0 h1{margin-top:18px;font-family:var(--mincho);font-weight:400;font-size:34px;
  letter-spacing:.1em;display:flex;align-items:flex-start;gap:10px;
  opacity:0;animation:rise .5s var(--e) .2s forwards}
#s0 .sub{margin-top:14px;font-size:14px;letter-spacing:.14em;color:var(--ink2);
  opacity:0;animation:riseSm .5s var(--e) .32s forwards}
#s0 .hint{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));
  font-size:14px;letter-spacing:.1em;color:var(--mute);
  opacity:0;animation:fade .6s ease 1s forwards}
.seal{display:inline-block;line-height:0;flex:0 0 auto}
.seal svg{display:block;width:100%;height:100%}
#s0 .seal{animation:rise .5s var(--e) .7s forwards,breathe 2s ease-in-out 1.2s infinite;opacity:0}
#s0 .out{transition:opacity .24s var(--e-exit),transform .24s var(--e-exit)}
#s0.go .out{opacity:0;transform:translateY(-14px)}

/* ── 绣场 · 满屏布面 ── */
#s1{touch-action:none;z-index:2}
#s1.lift{background:transparent}   /* 纸掀走到哪，新页就露到哪 */
#skip{position:absolute;right:14px;top:calc(52px + env(safe-area-inset-top));z-index:9;
  font:12px/1 var(--sans);letter-spacing:.1em;color:var(--mute);background:rgba(244,239,227,.8);
  border:1px solid var(--line);border-radius:1px;padding:8px 11px;cursor:pointer}
#s1 .kick{position:absolute;left:0;right:0;top:calc(64px + env(safe-area-inset-top));
  text-align:center;font-size:10px;letter-spacing:.34em;color:var(--mute);z-index:5}
#board{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#zoomlayer{position:absolute;inset:0;transform-origin:0 0;
  transition:transform 1.1s var(--e);will-change:transform}
#qbar{position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(34px + env(safe-area-inset-bottom));
  text-align:center;font-size:14px;letter-spacing:.12em;color:var(--ink2);z-index:5;
  background:rgba(244,239,227,.85);padding:9px 18px;border-radius:1px;
  width:max-content;max-width:82%;
  transition:opacity .24s var(--e)}
#qbar.swap{opacity:0}
#startdotg{transition:transform .3s var(--e)}
#startdot{transition:opacity .3s ease}
#dotring{transform-origin:center;transform-box:fill-box;animation:ring 2.2s ease-out infinite}
#needle,#handL,#handR{will-change:transform}
#handL,#handR{transition:opacity .6s ease}
.st-track{stroke:rgba(30,27,24,.24);stroke-width:1.4;stroke-dasharray:2 3}
.st-under{stroke:rgba(166,64,44,.25);stroke-width:1.4;fill:none}
.st-fill{stroke:rgba(166,64,44,.55);stroke-width:5;stroke-linecap:round}
.st-done{stroke:#A6402C;stroke-width:3;stroke-linecap:round;animation:stIn .16s ease backwards}
.st-hole{fill:#A6402C}
#pierced{transition:opacity .28s ease;pointer-events:none}
#craftseal .s-in{transform-box:fill-box;transform-origin:center}
#craftseal.on .s-in{animation:stampIn .7s var(--e-yin) forwards}

/* ── 盖印与掀纸：定妆纸是纸层的一页，盖下/掀走共用同一个物理动作 ── */
#veil{position:absolute;inset:0;z-index:8;display:none;background:#F4EFE3}
#veil.on{display:block;animation:veilIn .32s var(--e) backwards}
#veil .boardzoom{position:absolute;inset:0}
#sealhz .s-in{opacity:0;transform-box:fill-box;transform-origin:center}
#veil.on #sealhz .s-in{animation:stampIn .7s var(--e-yin) .38s forwards}
#veilcue{position:absolute;left:50%;top:71.5%;transform:translateX(-50%);opacity:0;
  background:none;border:1px solid rgba(166,64,44,.55);color:var(--acc);cursor:pointer;
  font:13px/1 var(--sans);letter-spacing:.18em;padding:11px 20px 11px 23px;border-radius:1px}
#veil.on #veilcue{animation:fade .5s ease 1.35s forwards}
#paperlayer{position:absolute;inset:0;transform-origin:50% 100%}
#s1.lift #paperlayer{transition:transform .55s var(--e-exit);
  transform:rotateX(-13deg) translateY(-102%)}

/* ── 首页示意（透明底：掀纸时纸在上盖住本页，掀走即露出） ── */
#s3{z-index:1;background:transparent}
/* 收下直跳 v5#p10：掀纸期间 s3 只露纯纸，页壳（状态栏/导航/tab）先藏，避免空壳破相 */
#s3.bare .statusbar,#s3.bare .mnav,#s3.bare .tabbar{display:none}
.statusbar{flex:0 0 47px;height:47px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px 0 28px;position:relative;z-index:7}
.statusbar .st{font:600 14px/1 var(--sans);letter-spacing:.02em}
.statusbar .sicons{display:flex;gap:5px;align-items:center;opacity:.88}
.mnav{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:center;position:relative;
  border-bottom:1px solid rgba(30,27,24,.10);z-index:7}
.mnav .ntitle{position:absolute;left:50%;transform:translateX(-50%);
  font:500 17px/1 var(--sans);letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.capsule{position:absolute;right:7px;top:6px;width:87px;height:32px;border-radius:16px;
  border:.5px solid rgba(30,27,24,.14);background:rgba(244,239,227,.72);color:var(--ink2);
  display:flex;align-items:center;justify-content:space-between}
.capsule .cg{width:43px;display:flex;justify-content:center}
.capsule i{width:.5px;height:18px;background:rgba(30,27,24,.14)}
.capsule svg{fill:currentColor}
/* 底部 tabBar：对齐 v5 D1 拍板（小程序规范，仅 L1） */
.tabbar{flex:0 0 auto;display:flex;background:var(--paper);border-top:1px solid var(--line);
  padding:7px 12px calc(9px + env(safe-area-inset-bottom));position:relative;z-index:6}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  text-decoration:none;color:var(--mute);font-size:10px;letter-spacing:.14em;cursor:pointer}
.tabbar a svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--acc)}
.r-ar{margin-left:auto;width:8px;height:8px;flex:0 0 auto;border-right:1px solid var(--orn);
  border-top:1px solid var(--orn);transform:rotate(45deg)}
.sbody{flex:1;overflow-y:auto;scrollbar-width:none;padding:0 26px 26px}
.sbody::-webkit-scrollbar{display:none}
.pcard{margin-top:18px}
.s3in .pcard{animation:rise .5s var(--e) backwards}
.s3in .pcard.work{animation:riseUp .55s var(--e) backwards}
.pcard.c1{animation-delay:.25s}.pcard.c2{animation-delay:.31s}.pcard.c3{animation-delay:.37s}
.pcard.c4{animation-delay:.43s}
.work .wboard{position:relative;cursor:pointer}
.s3in .work .wboard::after{content:'';position:absolute;inset:-1px;border:1.5px solid var(--acc);
  opacity:0;animation:sealFade .8s ease .2s backwards;pointer-events:none}
.wboard .origin-tag{position:absolute;right:8px;top:8px;font:11px/1 var(--sans);
  letter-spacing:.08em;color:var(--mute);background:rgba(244,239,227,.85);
  border:1px solid var(--line);padding:4px 8px;border-radius:1px}
.wboard{border:1px solid var(--line);background:var(--paper2)}
.wboard svg{display:block;width:100%;height:auto}
.wboard.empty{display:grid;place-items:center;height:280px;border-style:dashed;
  background:transparent;color:var(--mute);font-size:13px;letter-spacing:.12em}
/* 题名对齐 v5 trow：32px --person，眉行 lab 10px */
.pcard .namerow{display:flex;align-items:flex-start;gap:10px;margin-top:16px}
.pcard .namerow .col{flex:1;min-width:0}
.pcard .lab{font-family:var(--mincho);font-size:10px;letter-spacing:.2em;color:var(--mute)}
.pcard .name{display:block;font-family:var(--mincho);font-size:32px;font-weight:400;
  letter-spacing:.06em;line-height:1.1;color:var(--person);margin-top:2px}
.pcard .name.sealrow{display:flex;align-items:flex-start;gap:10px}
.pcard .name .seal{margin-top:2px}
/* 元信息对齐 v5 meta dd：song 12px --acc-ink */
.pcard .role{margin-top:10px;font-family:var(--song);font-size:12px;letter-spacing:.04em;color:var(--acc-ink)}
.quote{margin-top:16px;padding-left:12px;border-left:2px solid var(--acc);
  font-family:var(--song);font-size:14px;line-height:2.05;color:var(--ink2)}
/* 收藏行对齐 v5 rcard 语言：纸白卡 */
.myseal{margin-top:22px;border:1px solid var(--line);padding:16px;display:flex;gap:14px;
  align-items:center;background:#FBF7EC;cursor:pointer}
.myseal .slot{width:52px;height:52px;flex:0 0 auto;display:grid;place-items:center}
.myseal .slot .seal{width:26px;height:40px}
.myseal .slot.empty{border:1px dashed rgba(166,64,44,.5)}
.myseal .txt{flex:1;min-width:0}
.myseal .t1{font-family:var(--song);font-size:13px;letter-spacing:.04em}
.myseal .t2{margin-top:5px;font-size:11px;letter-spacing:.06em;color:var(--mute)}
.myseal .r-ar{flex:0 0 auto}
.myseal .redo{margin-top:9px;display:inline-block;font-size:12px;letter-spacing:.1em;
  color:var(--acc);background:none;border:1px solid rgba(166,64,44,.5);padding:7px 12px;
  border-radius:1px;cursor:pointer}
/* 收尾句对齐 v5 prose p：12.5px / 2.05 */
.fin{margin-top:20px;font-family:var(--song);font-size:12.5px;line-height:2.05;color:var(--ink2);letter-spacing:.02em}

/* ── 匠人行对齐 v5 prowline：照片圆头 + song 名 + ghost 按钮 ── */
.prowrow{margin-top:18px;display:flex;gap:14px;align-items:center;cursor:pointer}
.prowrow .pavatar{width:42px;height:42px;flex:0 0 42px;overflow:hidden;border-radius:50%;background:var(--paper2)}
.prowrow .pavatar img{width:100%;height:100%;object-fit:cover;display:block}
.prowrow .ptxt{flex:1;min-width:0}
.prowrow .p1{display:block;font-family:var(--song);font-size:12px;font-weight:400;
  letter-spacing:.04em;color:var(--person)}
.prowrow .p2{display:block;margin-top:4px;font-size:10px;letter-spacing:.06em;color:var(--mute)}
.prowrow .pgo{flex:0 0 auto;height:36px;padding:0 14px;font:12px/1 var(--sans);letter-spacing:.1em;
  color:var(--acc);background:none;border:1px solid var(--acc);border-radius:1px;cursor:pointer}
.classlink{display:block;margin-top:14px;padding:0;background:none;border:0;cursor:pointer;
  font:12px/1 var(--sans);letter-spacing:.12em;color:var(--mute);text-align:left}
.classlink .arr{color:var(--acc);margin-left:6px}

/* ── 三步图卡 ── */
#cards{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;
  background:var(--paper);padding:56px 26px 30px;overflow-y:auto;scrollbar-width:none}
#cards.on{display:flex}
#cards h2{font-family:var(--mincho);font-weight:400;font-size:24px;letter-spacing:.1em}
#cards .lead{margin-top:8px;font-size:14px;line-height:1.8;color:var(--ink2)}
.step{margin-top:16px;border:1px solid var(--line);padding:14px;display:flex;gap:14px;align-items:center}
.step .no{font-family:var(--mincho);font-size:22px;color:var(--acc);flex:0 0 30px}
.step .st1{font-size:14px;letter-spacing:.08em}
.step .st2{margin-top:4px;font-size:12px;color:var(--mute);letter-spacing:.04em}
#cards .go{margin-top:22px;height:46px;background:var(--acc);color:var(--paper);border:0;
  font:14px/1 var(--sans);letter-spacing:.16em;cursor:pointer;border-radius:1px}

@keyframes rise{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes riseUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes sealFade{from{opacity:.9}to{opacity:0}}
@keyframes veilIn{from{transform:translateY(-102%)}}
@keyframes riseSm{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes kick{to{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes ring{0%{transform:scale(.5);opacity:.55}70%{transform:scale(1.9);opacity:0}100%{opacity:0}}
@keyframes stIn{from{opacity:0}}
@keyframes stampIn{0%{opacity:0;transform:scale(1.6)}60%{opacity:1;transform:scale(.96)}100%{opacity:1;transform:scale(1)}}
.stage.nofx *,.stage.nofx *::before,.stage.nofx *::after{
  transition:none!important;animation:none!important;opacity:1}
.stage.nofx #s0 .in>*,.stage.nofx #s0 .hint,.stage.nofx #s0 .kick{opacity:1}
@media (prefers-reduced-motion:reduce){
  .stage *{animation-duration:.01s!important;animation-iteration-count:1!important}
}

let sealUid=0;
function sealSVG(w,h,art,nested){
  const id='mSeal'+(++sealUid), a=SEAL_ART[art];
  const s=Math.min(13/a.w,23/a.h), aw=a.w*s, ah=a.h*s;   /* 字图适配内框（18×28 局部系） */
  return `<svg ${nested?`x="0" y="0" width="${w}" height="${h}" `:''}viewBox="0 0 ${w} ${h}" aria-hidden="true"><mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="18" height="28"><image href="${a.b64}" x="${((18-aw)/2).toFixed(2)}" y="${((28-ah)/2).toFixed(2)}" width="${aw.toFixed(2)}" height="${ah.toFixed(2)}" preserveAspectRatio="xMidYMid meet"/></mask><g transform="scale(${(w/18).toFixed(4)},${(h/28).toFixed(4)})"><path d="${SEAL_OUT}" fill="#A6402C"/><rect width="18" height="28" fill="#F4EFE3" mask="url(#${id})"/><path d="${SEAL_KEY}" fill="none" stroke="#F4EFE3" stroke-width=".85" vector-effect="non-scaling-stroke"/></g></svg>`;
}

ST.forEach((s,i)=>{

function svgPoint(e){const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;

function qbarSwap(txt){ qbar.classList.add('swap');
  setTimeout(()=>{qbar.textContent=txt;qbar.classList.remove('swap');},240); }

function placeStartdot(s,instant){
  if(instant){startdotg.style.transition='none';}
  startdotg.style.transform=`translate(${s[0]}px,${s[1]}px)`;
  if(instant){void startdotg.getBoundingClientRect();startdotg.style.transition='';}
  startdot.style.opacity=1; dotring.style.opacity=1;
}
function placeNeedle(){
  placeStartdot(ST[ci],false);
  render={x:ST[ci][0],y:ST[ci][1]}; ptr={...render};
  qbarSwap(CAT.qs[ci<4?0:ci<AUTO_FROM?1:2]);
}
function markDone(i){
  const s=ST[i];
  gDone.appendChild(el('line',{x1:s[0],y1:s[1],x2:s[2],y2:s[3],class:'st-done'}));
  gDone.appendChild(el('circle',{cx:s[0],cy:s[1],r:2,class:'st-hole'}));
  gDone.appendChild(el('circle',{cx:s[2],cy:s[3],r:2,class:'st-hole'}));
  if(i<N-1){const n=ST[i+1];
    gUnder.appendChild(el('line',{x1:s[2],y1:s[3],x2:n[0],y2:n[1],class:'st-under'}));}
}
/* 针脚间摆渡：二次贝塞尔小弧，弧向背离花心 */
function transitTo(p1,cb,dur){
  const p0={x:render.x,y:render.y};
  const mx=(p0.x+p1.x)/2,my=(p0.y+p1.y)/2;
  const dx=p1.x-p0.x,dy=p1.y-p0.y,L=Math.hypot(dx,dy)||1;
  const px=-dy/L,py=dx/L,off=Math.min(30,L*.28);
  const side=((mx-CT.x)*px+(my-CT.y)*py)>=0?1:-1;
  transit={p0,p1,cp:{x:mx+px*off*side,y:my+py*off*side},
    t0:performance.now(),dur:dur||(MOFF?1:780),cb};
}
function enterBoard(){
  phase='board'; s0.classList.remove('on'); s1.classList.add('on');
  $('#s1kick').textContent=CAT.label;
  placeNeedle();
  requestAnimationFrame(tick);
}
function beginStitch(){
  if(dragging||autoSewing||transit)return;
  clearTimeout(restTimer); restUntil=0; restPending=false;
  dragging=true; stall=0; buzz(10);
  render={x:ptr.x,y:ptr.y};   /* 落针即到指尖：进度从落点起算，不出针尖乱飞 */
  plunge=(MOFF||REDUCED)?0:1;                       /* 没入感：针身沿轴下沉 */
  pierced.setAttribute('transform',`translate(${ptr.x},${ptr.y})`);
  pierced.style.opacity=.95;
  startdot.style.opacity=0; dotring.style.opacity=0;
}
function doneStitch(){
  markDone(ci); buzz(8); ci++; dragging=false;
  fillline.style.opacity=0;
  if(ci===4&&!handOn){handOn=true;   /* 师傅待命：按住屏幕才显手 */
    craftseal.setAttribute('opacity','1');craftseal.classList.add('on');}  /* 布上落匠印 */
  if(ci>=N){toSeal();return;}
  if(ci===AUTO_FROM){startAuto();return;}
  /* 出针顿一拍（300ms），再缓摆渡到下一针的入针点；restPending 供外部查询就绪 */
  const expect=ci;
  restUntil=performance.now()+(MOFF?1:300); restPending=true;
  restTimer=setTimeout(()=>{ restPending=false;
    if(phase==='board'&&!dragging&&!autoSewing&&ci===expect)
      transitTo({x:ST[ci][0],y:ST[ci][1]},placeNeedle); },MOFF?1:300);
}
/* ═══ 收尾：推近 → 师傅缝花心茎叶 → 拉远 → 盖印 ═══ */
function zoomTo(k,cx,cy){
  zoomlayer.style.transform=`translate(${195-cx*k}px,${422-cy*k}px) scale(${k})`;
}
function startAuto(){
  autoSewing=true; dragging=false; handsShown=null;
  qbarSwap(CAT.qs[2]);
  if(!MOFF)zoomTo(1.38,185,465);   /* 1.38×：放宽视野，双手入画不局促 */
  setTimeout(autoNext,MOFF?60:1150);
}
function autoNext(){
  if(ci>=N){finishAuto();return;}
  transitTo({x:ST[ci][0],y:ST[ci][1]},()=>{
    startdot.style.opacity=0; dotring.style.opacity=0;
    autoSew={ph:'in',t0:performance.now(),dur:MOFF?1:280};
    plunge=(MOFF||REDUCED)?0:1;                       /* 师傅入针同样没入 */
    pierced.setAttribute('transform',`translate(${ST[ci][0]},${ST[ci][1]})`);
    pierced.style.opacity=.95;
  },MOFF?1:560);
}
function finishAuto(){
  autoSew=null;
  pierced.style.opacity=0;
  if(!MOFF)zoomTo(1,195,422);
  setTimeout(toSeal,MOFF?60:1550);
}

/* ═══ v5 跳转解析：预览服务的根目录不一（曾现 404 Not Found），先探测可达的 v5 真源再跳 ═══ */
const V5CANDS=['../yuejian-plan/v5.html?shell=off','/yuejian-plan/v5.html?shell=off','../../yuejian-plan/v5.html?shell=off','v5.html?shell=off'];
let V5PROBE=null;
function probeV5(){
  if(V5PROBE)return V5PROBE;
  if(location.protocol==='file:'){V5PROBE=Promise.resolve(V5CANDS[0]);return V5PROBE;}
  V5PROBE=V5CANDS.reduce((p,c)=>p.then(hit=>hit||fetch(c,{method:'HEAD'})
    .then(r=>r.ok?c:null).catch(()=>null)),Promise.resolve(null));
  return V5PROBE;
}
function navHint(){
  if($('#navhint'))return;
  const d=document.createElement('div');
  d.id='navhint';
  d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;'+
    'background:#F4EFE3;border:1px solid rgba(30,27,24,.2);padding:12px 16px;max-width:330px;'+
    "font:12px/1.9 Songti SC,serif;color:#1E1B18;letter-spacing:.03em;text-align:center";
  d.innerHTML='衔接稿 v5.html 不在这份预览的服务范围内，跳不出去。<br>请从工作区根目录起服务，或直接用文件方式打开本页。';
  document.body.appendChild(d);
}
function goV5(h){
  probeV5().then(hit=>{
    if(hit){ location.href=hit+h; }
    else{ navHint(); }   /* 失败态：答「停在哪」——人还在本页，针脚进度不丢 */
  });
}
function lift(){
  phase='home';
  s3.classList.add('bare');          /* 掀纸期间只露纯纸，页壳藏起 */
  s1.classList.add('lift');          /* 定妆纸是纸层的一页：整叠纸一起掀走 */
  /* 全流程闭环：收下 → 掀纸走完 → 直落 v5 P10「我的手泽」（物件存进册里，册页展开） */
  setTimeout(()=>goV5('#p10'),620);
}
function skip(){ goV5('#p1'); }   /* 三阀①：拍板直进首页（P1 已并入 v5 十屏） */

/* ═══ 指针：落在屏幕任意处即可拖针 ═══ */
svg.addEventListener('pointerdown',e=>{
  if(phase!=='board'||autoSewing||transit)return;
  ptr=svgPoint(e); down=true;
  beginStitch();
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener('pointermove',e=>{ if(phase==='board') ptr=svgPoint(e); });
addEventListener('pointerup',()=>{
  down=false; dragging=false;
  pierced.style.opacity=0;
  if(phase!=='board'||autoSewing)return;
  if(dragT>=DONE_T) doneStitch();
  dragT=0;
});

function needleTail(tip,ang){
  const r=ang*Math.PI/180;
  return {x:tip.x-100*Math.cos(r)+65.3*Math.sin(r), y:tip.y-65.3*Math.cos(r)-100*Math.sin(r)};
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ═══ 主循环 ═══ */
function tick(t){
  if(phase!=='board'&&phase!=='seal'){requestAnimationFrame(tick);return;}
  let fillAmt=-1, fillOp=0;
  const angTarget=MENTOR_ANG;   /* 针不再转向：全程固定捏合轴，只位移 */
  if(transit){
  const k=Math.min(1,(t-transit.t0)/transit.dur),
        e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;   /* easeInOutCubic：起行收势都缓 */
  const ax=lerp(transit.p0.x,transit.cp.x,e), ay=lerp(transit.p0.y,transit.cp.y,e);
  const bx=lerp(transit.cp.x,transit.p1.x,e), by=lerp(transit.cp.y,transit.p1.y,e);
  render={x:lerp(ax,bx,e),y:lerp(ay,by,e)};
  if(k>=1){const cb=transit.cb;transit=null;cb&&cb();}
  }else if(phase==='board'&&!autoSewing){
    const s=ST[ci], ax=s[0], ay=s[1],
          ux=(s[2]-s[0])/segLen[ci], uy=(s[3]-s[1])/segLen[ci];
    if(dragging){
      render={x:lerp(render.x,ptr.x,.35),y:lerp(render.y,ptr.y,.35)};
      const px=render.x-ax, py=render.y-ay;
      dragT=Math.max(0,Math.min(1,(px*ux+py*uy)/segLen[ci]));
      const perp=Math.abs(px*uy-py*ux);
      fillAmt=dragT; fillOp=Math.max(0,1-perp/70)*.9;   /* 针在路线上 → 虚线填浅红 */
      stall+=16;
      if(stall>8000){doneStitch();}   /* 停滞阀：师傅替您扎这一针 */
    }else if(performance.now()<restUntil){
      /* 出针后的顿拍：停在原位，等摆渡 */
    }else{
      render={x:lerp(render.x,ax,.14),y:lerp(render.y,ay,.14)};
    }
    startdot.style.opacity=dragging?0:1;
    dotring.style.opacity=dragging?0:1;
  }else if(autoSew){
    const s=ST[ci];
    if(autoSew.ph==='in'){                       /* 入针：顿一拍 */
      render={x:s[0],y:s[1]};
      if(t-autoSew.t0>=autoSew.dur)autoSew={ph:'sweep',t0:t,dur:MOFF?1:760};
    }else if(autoSew.ph==='sweep'){              /* 拉线 */
      const k=Math.min(1,(t-autoSew.t0)/autoSew.dur);
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      render={x:lerp(s[0],s[2],e),y:lerp(s[1],s[3],e)};
      fillAmt=e; fillOp=.9;
      if(k>=1)autoSew={ph:'out',t0:t,dur:MOFF?1:320};
    }else{                                       /* 出针：再顿一拍 */
      render={x:s[2],y:s[3]};
      if(t-autoSew.t0>=autoSew.dur){
        autoSew=null; markDone(ci); buzz(8); ci++;
        if(ci>=N)finishAuto(); else autoNext();
      }
    }
  }
  const tip=render;
  if(!Number.isFinite(tip.x+tip.y)){requestAnimationFrame(tick);return;}
  curAng=angTarget;
  plunge+=(0-plunge)*.10;   /* 没入感 ~0.35s 缓出 */
  needle.setAttribute('transform',`translate(${tip.x},${tip.y}) rotate(${curAng})`+
    (plunge>.01?` translate(${(-10.04*plunge).toFixed(2)},${(-6.56*plunge).toFixed(2)})`:''));
  /* 浅红填充线：顺着虚线走到针的投影处 */
  if(fillAmt>=0){
    const s=ST[ci], ux=(s[2]-s[0])/segLen[ci], uy=(s[3]-s[1])/segLen[ci];
    fillline.setAttribute('x1',s[0]); fillline.setAttribute('y1',s[1]);
    fillline.setAttribute('x2',s[0]+ux*fillAmt*segLen[ci]);
    fillline.setAttribute('y2',s[1]+uy*fillAmt*segLen[ci]);
    fillline.style.opacity=fillOp;
  }else fillline.style.opacity=0;
  /* 师傅双手：按住才显（收尾段常显）；固定姿态，只位移 */
  const want=handOn&&(dragging||autoSewing);
  if(want!==handsShown){
    handsShown=want;
    handR.style.opacity=want?1:0; handL.style.opacity=want?1:0;
  }
  if(handOn){
    const tail=needleTail(tip,curAng);
    if(Number.isFinite(tail.x+tail.y)){
      if(!handRPos)handRPos={...tail};
      handRPos={x:lerp(handRPos.x,tail.x,.13),y:lerp(handRPos.y,tail.y,.13)};
      handR.setAttribute('transform',`translate(${handRPos.x},${handRPos.y})`);
    }
    const lt={x:tip.x-180,y:tip.y+123};   /* 指尖止于针尖前 ~30px，不压针身 */
    if(!handLPos)handLPos={...lt};
    handLPos={x:lerp(handLPos.x,lt.x,.07),y:lerp(handLPos.y,lt.y,.07)};
    handL.setAttribute('transform',`translate(${handLPos.x},${handLPos.y})`);
  }
  requestAnimationFrame(tick);
}

/* ═══ 我的 · 作品页 ═══ */
function buildS3(skipped){
  const done=!skipped;
  const lines=ST.map(s=>`<line x1="${s[0]}" y1="${s[1]}" x2="${s[2]}" y2="${s[3]}"/>`).join('');
  const work=`<svg viewBox="24 224 344 400" aria-hidden="true">
    <rect x="24" y="224" width="344" height="400" fill="#EAE1CE"/>
    <rect x="24" y="224" width="344" height="400" fill="url(#weave)"/>
    <g stroke="#A6402C" stroke-width="2.8" stroke-linecap="round" fill="none">${lines}</g>
  </svg>`;
  $('#s3body').innerHTML= done? `
    <div class="pcard c1 work">
      <div class="wboard">${work}<span class="origin-tag">看原作 →</span></div>
      <div class="namerow"><span class="col">
        <span class="lab">手泽 · 第壹件</span>
        <span class="name">第一片</span></span>
        <span class="seal" style="width:18px;height:28px;margin-top:6px">${sealSVG(18,28,'yuexiu')}</span></div>
      <div class="role">今日上手 · 广绣小花 · 十二针 · 梁玉屏替您收针</div>
      <div class="fin">这朵花是您的——她的手，替您缝完了花心与茎叶。</div>
    </div>
    <div class="pcard c2 prowrow" id="prow">
      <span class="pavatar"><img src="assets/ren-01-face.jpg" alt="梁玉屏"></span>
      <div class="ptxt">
        <span class="p1">梁玉屏</span>
        <span class="p2">替您收了花心茎叶 · 从艺四十二年</span>
      </div>
      <button class="pgo" id="goP4">认识她</button>
    </div>
    <button class="pcard c3 classlink" id="goP6">她的课 · 周六 · 广绣上手<span class="arr">→</span></button>
    <div class="pcard c4 myseal" id="goP8">
      <span class="slot"><span class="seal" style="width:26px;height:40px">${sealSVG(26,40,'shouze')}</span></span>
      <div class="txt">
        <div class="t1">我的手泽</div>
        <div class="t2">已收 1 件 · 下一件待解锁</div>
      </div>
      <span class="r-ar"></span>
    </div>` : `
    <div class="pcard c1 myseal">
      <span class="slot empty"></span>
      <div class="txt">
        <div class="t1">我的手泽</div>
        <div class="t2">这格留给您的第一针</div>
        <button class="redo" id="redo">回到开场 · 缝一针</button>
      </div>
    </div>`;
  const r=$('#redo'); if(r)r.onclick=()=>location.reload();
  /* 出口钩子（hash 协议冻结）：作品→原作（P3）· 匠人行→档案（P4）· 次级→课程（P6）· 收藏行→我的（P8），直落 v5 */
  const prow=$('#prow'); if(prow)prow.onclick=()=>goV5('#p4');
  const g6=$('#goP6'); if(g6)g6.onclick=()=>goV5('#p6');
  const g8=$('#goP8'); if(g8)g8.onclick=()=>goV5('#p8');
  const wb=document.querySelector('.work .wboard');
  if(wb)wb.onclick=()=>goV5('#p3');
}
$('#skip').onclick=skip;
$('#veilcue').onclick=lift;
$('#s0kick').textContent='广府非遗 · '+CAT.label.split(' · ')[0];
$('#s0').addEventListener('pointerdown',()=>{
  if(phase!=='s0')return;
  phase='go'; s0.classList.add('go');
  setTimeout(()=>{s0.classList.remove('on','go'); enterBoard();},240);
});

/* 起针朱点初始就位 */
placeStartdot(ST[0],true);
render={x:ST[0][0],y:ST[0][1]}; curAng=MENTOR_ANG;

if(VISITED){ s0.classList.remove('on'); buildS3(true); s3.classList.add('on','s3in');
  setTimeout(()=>s3.classList.remove('s3in'),1150); phase='home'; }
else if(REDUCED){
  $('#cards').classList.add('on');
  $('#cardgo').onclick=()=>{$('#cards').classList.remove('on');enterBoard();};
}
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')location.reload();});
requestAnimationFrame(tick);
