<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页改写 · 阅读地图</title>
<style>
  :root {
    --paper: #f7f7f4;
    --ink: #26251e;
    --muted: #67665f;
    --stone: #e8e6e0;
    --panel: #eeede8;
    --soft: #f1f0eb;
    --accent: #f54e00;
    --line: rgb(38 37 30 / 12%);
    --radius: 10px;
    --font: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }

  html { background: var(--paper); color: var(--ink); font-family: var(--font); scroll-behavior: smooth; }
  body { margin: 0; -webkit-font-smoothing: antialiased; }

  ::selection { background: var(--accent); color: #fff; }

  button, input { font: inherit; color: inherit; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---------- 顶栏 ---------- */
  .bar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 16px;
    padding: 12px clamp(16px, 3vw, 32px);
    background: rgb(247 247 244 / 88%);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; font-size: 14px; letter-spacing: .01em; }
  .brand b { font-weight: 600; white-space: nowrap; }
  .brand i { font-style: normal; color: var(--muted); white-space: nowrap; }
  .brand span { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }

  .field {
    display: flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid var(--line); border-radius: 999px;
    padding: 0 12px; height: 34px;
  }
  .field input {
    border: 0; background: transparent; width: 150px; font-size: 13px; outline: none;
  }
  .field kbd {
    font: inherit; font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
  }

  .btn {
    height: 34px; padding: 0 12px; border-radius: 999px; cursor: pointer;
    background: #fff; border: 1px solid var(--line);
    font-size: 13px; white-space: nowrap;
    transition: background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .btn:hover { background: var(--soft); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .btn .arrow { color: var(--accent); margin-right: 4px; }

  /* ---------- 布局 ---------- */
  .shell {
    display: grid;
    grid-template-columns: minmax(232px, 27%) minmax(0, 1fr);
    gap: clamp(24px, 4vw, 56px);
    max-width: 74rem;
    margin: 0 auto;
    padding: 24px clamp(16px, 3vw, 32px) 96px;
    align-items: start;
  }

  /* ---------- 导图 ---------- */
  .map {
    position: sticky; top: 74px;
    max-height: calc(100vh - 96px); overflow: auto;
    padding: 4px 4px 24px 0;
  }
  .map__title {
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 12px 2px;
  }

  .tree, .tree ul { list-style: none; margin: 0; padding: 0; }

  .tree > li { position: relative; }

  .tree ul li {
    position: relative;
    padding: 3px 0 3px 20px;
  }
  /* 竖向连线 */
  .tree ul li::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
    background: var(--line);
  }
  .tree ul li:last-child::before { bottom: 50%; }
  /* 横向支线 */
  .tree ul li::after {
    content: ""; position: absolute; left: 0; top: 50%; width: 14px; height: 1px;
    background: var(--line);
  }

  .node {
    display: inline-flex; align-items: center; gap: 8px;
    max-width: 100%;
    padding: 5px 12px; border-radius: 999px;
    background: transparent; border: 1px solid transparent;
    font-size: 13.5px; line-height: 1.4; text-align: left;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease, opacity .2s ease;
  }
  .node:hover { background: #fff; border-color: var(--line); }
  .node .dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--stone);
    flex: 0 0 auto; transition: background .15s ease, transform .15s ease;
  }
  .node .num {
    font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums;
    flex: 0 0 auto;
  }
  .node .txt { min-width: 0; }

  .node[aria-current="true"] {
    background: #fff; border-color: var(--accent); color: var(--ink);
    box-shadow: 0 2px 14px rgb(245 78 0 / 10%);
  }
  .node[aria-current="true"] .dot { background: var(--accent); transform: scale(1.35); }
  .node[aria-current="true"] .num { color: var(--accent); }

  .tree.is-dimmed .node { opacity: .34; }
  .tree .node.hit { opacity: 1; }
  .tree .node.hit .txt { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }

  .tree > li.root > .node {
    font-size: 15px; font-weight: 600; padding: 8px 14px;
    background: var(--ink); color: var(--paper); border-color: var(--ink);
  }
  .tree > li.root > .node .dot { background: var(--accent); }
  .tree > li.root > .node:hover { background: #17160f; border-color: #17160f; }

  /* ---------- 正文 ---------- */
  .doc { min-width: 0; }

  .doc__intro {
    border: 1px solid var(--line); background: #fff; border-radius: var(--radius);
    padding: 16px 18px; margin-bottom: 8px;
  }
  .doc__intro p { margin: 0; font-size: 13.5px; line-height: 1.85; color: var(--muted); }
  .doc__intro b { color: var(--ink); font-weight: 600; }
  .doc__intro kbd {
    font: inherit; font-size: 11px; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; background: var(--soft); color: var(--ink);
  }

  .panel {
    padding: 30px 0 34px;
    border-bottom: 1px solid var(--line);
    scroll-margin-top: 78px;
  }
  .panel:last-child { border-bottom: 0; }

  .panel__head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .panel__index {
    font-size: 11px; letter-spacing: .1em; color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .panel h2 { margin: 0; font-size: clamp(20px, 2.2vw, 26px); font-weight: 500; letter-spacing: -.01em; }
  .panel__lead {
    margin: 0 0 16px; font-size: 17px; line-height: 1.75; color: var(--ink);
    max-width: 40rem;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; padding: 0; list-style: none; }
  .chips li {
    font-size: 11.5px; color: var(--muted); background: var(--soft);
    border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px;
    font-variant-numeric: tabular-nums;
  }

  .points { margin: 0; padding: 0; list-style: none; max-width: 42rem; }
  .points li {
    position: relative; padding-left: 16px; margin-bottom: 8px;
    font-size: 14.5px; line-height: 1.85;
  }
  .points li::before {
    content: ""; position: absolute; left: 0; top: .78em;
    width: 5px; height: 5px; border-radius: 50%; background: var(--stone);
  }
  .points li b { font-weight: 600; }
  .points li code, .panel code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .9em; background: var(--soft); border-radius: 4px; padding: 1px 5px;
  }

  .compare { display: grid; gap: 10px; margin: 18px 0 0; max-width: 46rem; }
  .compare__row {
    display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px;
    align-items: start;
  }
  .compare__tag {
    font-size: 11px; color: var(--muted); letter-spacing: .08em;
    padding-top: 12px;
  }
  .compare__body {
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 11px 14px; font-size: 14px; line-height: 1.8;
  }
  .compare__row--new .compare__tag { color: var(--accent); }
  .compare__row--new .compare__body { border-color: rgb(245 78 0 / 32%); background: #fffaf7; }

  .table { margin: 18px 0 0; border-collapse: collapse; width: 100%; max-width: 46rem; font-size: 13.5px; }
  .table th, .table td {
    text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line);
    vertical-align: top; line-height: 1.6;
  }
  .table th { font-weight: 500; color: var(--muted); font-size: 11.5px; letter-spacing: .06em; }
  .table tr:last-child td { border-bottom: 0; }
  .table td:first-child { font-variant-numeric: tabular-nums; white-space: nowrap; }

  .note {
    margin: 16px 0 0; max-width: 42rem; font-size: 13px; line-height: 1.85; color: var(--muted);
    border-left: 2px solid var(--accent); padding-left: 12px;
  }

  .alts { margin: 14px 0 0; padding: 0; list-style: none; max-width: 42rem; }
  .alts li {
    font-size: 13.5px; line-height: 1.8; padding: 7px 0; border-bottom: 1px dashed var(--line);
  }
  .alts li:last-child { border-bottom: 0; }
  .alts .no { color: var(--muted); }
  .alts .why { color: var(--muted); }
  .alts .no::before { content: "未采用　"; color: var(--accent); font-size: 11px; letter-spacing: .06em; }

  .brief-note { display: none; }
  body[data-brief="true"] .detail { display: none; }
  body[data-brief="true"] .compare__row:not(.compare__row--new) { display: none; }
  body[data-brief="true"] .compare { margin-top: 12px; }

  /* ---------- 窄屏 ---------- */
  @media (max-width: 860px) {
    .shell { grid-template-columns: minmax(0, 1fr); gap: 8px; padding-bottom: 64px; }
    .map {
      position: sticky; top: 58px; z-index: 10;
      max-height: none; overflow: visible;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: 6px 0 12px; margin-bottom: 4px;
    }
    .map__title { display: none; }

    /* 窄屏把树摊成一条可横向滑动的节点带 */
    .tree > li.root { display: flex; align-items: center; gap: 6px; }
    .tree ul { display: flex; gap: 6px; }
    .tree ul li { padding: 0; }
    .tree ul li::before, .tree ul li::after { display: none; }
    .tree { overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .tree::-webkit-scrollbar { display: none; }
    .node { font-size: 12.5px; white-space: nowrap; padding: 5px 10px; }
    .tree > li.root > .node { font-size: 12.5px; padding: 5px 10px; }
    .field input { width: 84px; }
    .brand span { display: none; }
    .panel { padding: 24px 0 26px; }
  }

  @media (max-width: 560px) {
    .bar { gap: 8px; padding: 10px 14px; }
    .brand i, .field { display: none; }
    .tools { gap: 6px; }
    .btn { padding: 0 11px; font-size: 12.5px; }
    .map { top: 54px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body data-brief="false">

<header class="bar">
  <div class="brand"><b>首页改写</b><i>· 阅读地图</i><span id="count"></span></div>
  <div class="tools">
    <label class="field">
      <input id="q" type="search" placeholder="搜节点" aria-label="搜索节点">
      <kbd>/</kbd>
    </label>
    <button class="btn" id="back" type="button" disabled><span class="arrow" aria-hidden="true">←</span>返回</button>
    <button class="btn" id="mode" type="button" aria-pressed="false">只看结论</button>
  </div>
</header>

<div class="shell">
  <nav class="map" aria-label="思维导图">
    <p class="map__title">结构</p>
    <ul class="tree" id="tree"></ul>
  </nav>

  <main class="doc" id="doc">
    <div class="doc__intro">
      <p>
        <b>怎么读最快</b>　点导图里的节点跳到对应结论；<kbd>←</kbd> 返回上一处，也可以按 <kbd>⌫</kbd>。
        用 <kbd>↓</kbd> <kbd>↑</kbd> 在节点间移动，<kbd>Enter</kbd> 打开，<kbd>/</kbd> 搜节点。
        想快读就开「只看结论」，原文与未采用的写法会收起来，只留判断、要点和改后的文本。
      </p>
    </div>
    <!-- 面板由脚本注入 -->
  </main>
</div>

<script>
const SECTIONS = [
  {
    id: 'hero',
    short: '首屏导语',
    label: '首屏导语',
    meta: ['56→53 汉字', '2 行不变', '断在句号后'],

    ],
    compare: {
      before: '我关注复杂业务中，人们怎样找到信息并完成操作。设计时先理清业务关系，再沿着实际任务安排界面，让每一步都有所需的信息和反馈。',
      after: '12 年设计经验，现在专注 B 端产品的 UX 与 UI。PC、移动端和可视化大屏都做过项目。用 AI 直接把设计做成可操作的原型，以前这步要在 Figma 里另搭一遍。',
    },
  },
  {
    id: 'sentence',
    short: 'AI 与 Figma 那句',
    label: 'AI 与 Figma 那句',
    meta: ['动作在前，比较在后', '不宣称倍数'],
    lead: '动作在前、比较在后，读者自己就算出省了一道工。',
    points: [
      '前半句是现在能做的事，后半句是它替换掉的旧路径，「以前」一转折就够，不必说省了多少。',
      '「另搭一遍」比「再画一次」准。在 Figma 里做交互原型，确实是在设计稿之外再搭一层，连页面、连跳转、连状态。',
      '不对速度下结论。没有测过快多少，写「效率提升数倍」等于把演示当结论。',
      '「把设计做成」不能省。省掉「设计」这个宾语，读者看不出原型是从设计稿长出来的。',
    ],
    alts: [
      { no: '习惯把设计做成能点开的原型，直接上手试', why: '只说了习惯，没有新旧对比' },
      { no: 'AI 让原型可以直接做出来', why: '缺「设计」这个宾语，像工具演示' },
      { no: '从 AI 时代开始，原型可以直接做出来', why: '把「时代」当主语是口号，读者还得自己翻译成动作' },
    ],
    detail: true,
  },
  {
    id: 'wrap',
    short: '断行约束',
    label: '断行约束',
    meta: ['首行 629px', '余量 6.7px'],
    lead: '首行只有 629px，差十来个像素就会把「项目」拆成「都做过项／目。」。',
    table: {
      head: ['首行写法', '首行宽', '结果'],
      rows: [
        ['12 年 … UX 与 UI', '622.3px（余 6.7）', '断在「都做过项目。」后，干净'],
        ['12 年 … UX/UI', '省 4px', '余量变大，「用」被吸到上一行'],
        ['十二年 … UX 与 UI', '多 10px', '「目。」放不下，词被拆开'],
      ],
    },
    note: '同一个「UX/UI」缩写，「十二年」版里是唯一可行的省字办法，「12 年」版里反而破坏断行。余量只有 6.7px，换字体或调字号都会变，回填后要重拍一次截图。',
    detail: true,
  },
  {
    id: 'gis',
    short: '房产 GIS',
    label: '01 房产 GIS 体验重构',
    meta: ['A 面 57→72 汉字', 'B 面 57→57'],
    lead: '先说三项任务没变，再给面板、矩阵、并列三处具体改动。',
    points: [
      '选幢后的属性与入口收进同一块面板，整幢页把户室矩阵放回主区域，核对页把新旧户室和面积差并列。',
      'B 面把内部叫法「实测替换预测」翻成「测绘成果回系统时核对」，读者第一次遇到就能懂。',
      '边界落在 B 面：这是个人回溯重构，办理效率还没有真实数据。',
    ],
    detail: true,
  },
  {
    id: 'ai',
    short: 'AI 工作流',
    label: '02 AI 评审工作流',
    meta: ['A 面 65→55 汉字', 'B 面 55→45', '标题未改'],
    lead: '把三处真实故障写成 AI 会问的检查项，B 面交代用法和停在哪一步。',

    detail: true,
  },
  {
    id: 'brand',
    short: '品牌系统',
    label: '03 新禾智飞品牌系统',
    meta: ['A 面 60→60 汉字', 'B 面 53→45'],
    lead: '四家供应商各做各的，收成一张按场景排的标识选用表，再给颜色字体定层级与占比。',

    detail: true,
  },
  {

    label: '04 执行网查询助手',
    meta: ['A 面 64→75 汉字', 'B 面 58→46'],
    lead: '把人工验证留在官网，工具排队取数，结果按有记录、无记录、未完成分表导出。',
    points: [
      '补上「查什么」（新增被执行案件）和「为什么难」（旧方式一次只能查一个）。',

  {

    points: [

    ],
    compare: {
      before: '我有 12 年设计经验，从刊物、品牌视觉转向大屏、后台与 App 的产品设计。目前借助 AI 制作原型和查询工具，也把评审经验整理成检查规则，在实际操作中检验和修订。',
      after: '从刊物和品牌视觉转过来，12 年设计经验。页面结构、操作规则和状态含义由我定，AI 负责读材料、生成页面与重复检查，成品再回实际操作里核一遍。',
    },
    detail: true,
  },
  {
    id: 'budget',
    short: '版面预算',
    label: '版面预算',
    meta: ['每行 27.2px', '余量 14px'],
    lead: '关于的底边只剩 14px，多写一行就撞 993 的单屏契约。',
    table: {
      head: ['版本', '行数', '.about 底 / 993', '结论'],
      rows: [
        ['现状', '导语 2 行 · 每面 1 行', '979', '基准'],
        ['A 紧凑版', '导语 2 行 · 每面 1 行', '979', '行数守恒，原样通过'],
        ['B 完整版', '导语 3 行 · 每面 2 行', '1007', '超 14px，须放宽契约'],
      ],

/* ---------- 渲染 ---------- */
const treeEl = document.getElementById('tree');
const docEl = document.getElementById('doc');
const backBtn = document.getElementById('back');
const modeBtn = document.getElementById('mode');
const qInput = document.getElementById('q');
const countEl = document.getElementById('count');

const pad = n => String(n).padStart(2, '0');
const index = new Map(SECTIONS.map((s, i) => [s.id, { ...s, i }]));

const rootNode = {
  id: 'root',
  label: '首页改写草稿',
  children: SECTIONS.map(s => ({ id: s.id, label: s.short })),
};

function nodeButton(id, label, extra = '') {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'node';
  btn.dataset.id = id;
  const span = document.createElement('span');
  span.className = 'dot';
  btn.append(span);
  if (extra) {
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = extra;
    btn.append(num);
  }
  const txt = document.createElement('span');
  txt.className = 'txt';
  txt.textContent = label;
  btn.append(txt);
  btn.addEventListener('click', () => jump(id));
  return btn;
}

function buildTree() {
  const rootLi = document.createElement('li');
  rootLi.className = 'root';
  rootLi.append(nodeButton('root', rootNode.label));
  const ul = document.createElement('ul');
  rootNode.children.forEach((child, i) => {
    const li = document.createElement('li');
    li.append(nodeButton(child.id, child.label, pad(i + 1)));
    ul.append(li);
  });
  rootLi.append(ul);
  treeEl.append(rootLi);
}

function esc(t) { return String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function buildDoc() {
  SECTIONS.forEach((s, i) => {
    const sec = document.createElement('section');
    sec.className = 'panel';
    sec.id = s.id;

    const head = document.createElement('div');
    head.className = 'panel__head';
    head.innerHTML = `<span class="panel__index">${pad(i + 1)}</span><h2>${esc(s.label)}</h2>`;
    sec.append(head);

    const lead = document.createElement('p');
    lead.className = 'panel__lead';
    lead.textContent = s.lead;
    sec.append(lead);

    if (s.meta && s.meta.length) {
      const chips = document.createElement('ul');
      chips.className = 'chips';
      s.meta.forEach(m => {
        const li = document.createElement('li');
        li.textContent = m;
        chips.append(li);
      });
      sec.append(chips);
    }

    if (s.compare) {
      const wrap = document.createElement('div');
      wrap.className = 'compare';
      wrap.innerHTML = `
        <div class="compare__row">
          <span class="compare__tag">原</span>
          <div class="compare__body">${esc(s.compare.before)}</div>
        </div>
        <div class="compare__row compare__row--new">
          <span class="compare__tag">改</span>
          <div class="compare__body">${esc(s.compare.after)}</div>
        </div>`;
      sec.append(wrap);
    }

    if (s.points) {
      const ul = document.createElement('ul');
      ul.className = 'points';
      s.points.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = p;
        ul.append(li);
      });
      sec.append(ul);
    }

    if (s.table) {
      const table = document.createElement('table');
      table.className = 'table';
      const thead = document.createElement('thead');
      thead.innerHTML = `<tr>${s.table.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr>`;
      const tbody = document.createElement('tbody');
      tbody.innerHTML = s.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
      table.append(thead, tbody);
      sec.append(table);
    }

    if (s.alts) {
      const ul = document.createElement('ul');
      ul.className = 'alts detail';
      s.alts.forEach(a => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="no">${esc(a.no)}</span>　<span class="why">${esc(a.why)}</span>`;
        ul.append(li);
      });
      sec.append(ul);
    }

    if (s.note) {
      const p = document.createElement('p');
      p.className = 'note detail';
      p.textContent = s.note;
      sec.append(p);
    }

    docEl.append(sec);
  });
}

/* ---------- 跳转与返回 ---------- */
let current = 'root';
const stack = [];

function setActive(id) {
  current = id;
  treeEl.querySelectorAll('.node').forEach(n => {
    n.setAttribute('aria-current', String(n.dataset.id === id));
  });
  const btn = treeEl.querySelector(`.node[data-id="${id}"]`);
  const mapEl = document.querySelector('.map');
  if (!btn || !mapEl || mapEl.scrollHeight <= mapEl.clientHeight) return;
  const nr = btn.getBoundingClientRect();
  const mr = mapEl.getBoundingClientRect();
  if (nr.top < mr.top + 10) mapEl.scrollTop -= (mr.top + 10 - nr.top);
  else if (nr.bottom > mr.bottom - 10) mapEl.scrollTop += (nr.bottom - mr.bottom + 10);
}

let spyLock = 0;

function jump(id, opts = {}) {
  if (!index.has(id) && id !== 'root') return;
  if (opts.push !== false && id !== current) {
    stack.push(current);
    if (stack.length > 40) stack.shift();
  }
  setActive(id);
  backBtn.disabled = stack.length === 0;
  spyLock = Date.now() + 900;

  if (id === 'root') {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    history.replaceState(null, '', '#');
    return;
  }

  const el = document.getElementById(id);
  if (el) {
    const top = el.getBoundingClientRect().top + window.scrollY - 78;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  }
  history.replaceState(null, '', '#' + id);
}

function goBack() {
  const prev = stack.pop();
  if (!prev) return;
  jump(prev, { push: false });
  backBtn.disabled = stack.length === 0;
}

backBtn.addEventListener('click', goBack);

/* ---------- 只看结论 ---------- */
modeBtn.addEventListener('click', () => {
  const on = document.body.dataset.brief !== 'true';
  document.body.dataset.brief = String(on);
  modeBtn.setAttribute('aria-pressed', String(on));
});

/* ---------- 滚动跟随 ---------- */
const spy = new IntersectionObserver(entries => {
  if (Date.now() < spyLock) return;
  if (window.scrollY < 24) { if (current !== 'root') setActive('root'); return; }
  const visible = entries
    .filter(e => e.isIntersecting)
    .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
  if (visible) setActive(visible.target.id);
}, { rootMargin: '-72px 0px -62% 0px', threshold: 0 });

/* ---------- 搜索 ---------- */
function runSearch() {
  const q = qInput.value.trim().toLowerCase();
  const nodes = [...treeEl.querySelectorAll('.node')];
  if (!q) {
    treeEl.classList.remove('is-dimmed');
    nodes.forEach(n => n.classList.remove('hit'));
    return;
  }
  treeEl.classList.add('is-dimmed');
  nodes.forEach(n => {
    const hit = n.textContent.toLowerCase().includes(q);
    n.classList.toggle('hit', hit);
  });
}

qInput.addEventListener('input', runSearch);
qInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = treeEl.querySelector('.node.hit');
    if (first) jump(first.dataset.id);
    e.preventDefault();
  }
  if (e.key === 'Escape') {
    qInput.value = '';
    runSearch();
    qInput.blur();
  }
});

/* ---------- 键盘 ---------- */
const order = ['root', ...SECTIONS.map(s => s.id)];
document.addEventListener('keydown', e => {
  const typing = e.target instanceof HTMLInputElement;
  if (e.key === '/' && !typing) {
    e.preventDefault();
    qInput.focus();
    return;
  }
  if (typing) return;

  if (e.key === 'Escape') {
    jump('root');
    return;
  }
  if (e.key === 'Backspace' || (e.altKey && e.key === 'ArrowLeft')) {
    e.preventDefault();
    goBack();
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
    e.preventDefault();
    const i = order.indexOf(current);
    jump(order[Math.min(order.length - 1, i + 1)]);
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
    e.preventDefault();
    const i = order.indexOf(current);
    jump(order[Math.max(0, i - 1)]);
  }
});

/* ---------- 启动 ---------- */
buildTree();
buildDoc();
countEl.textContent = `${SECTIONS.length} 节`;
document.querySelectorAll('.panel').forEach(p => spy.observe(p));

const hash = location.hash.replace('#', '');
if (index.has(hash)) {
  setActive(hash);
  document.getElementById(hash).scrollIntoView({ block: 'start' });
} else {
  setActive('root');
}
</script>
